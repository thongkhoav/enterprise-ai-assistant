[project]
name = "enterprise-ai-assistant-backend"
version = "0.1.0"
description = "FastAPI + LangGraph enterprise AI assistant skeleton with RAG, tools, evals, and tracing."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "asyncpg>=0.31.0",
    "bcrypt>=4.2.0",
    "chromadb>=0.5.0",
    "email-validator>=2.2.0",
    "fastapi>=0.115.0",
    "greenlet>=3.5.1",
    "httpx>=0.27.0",
    "langgraph>=0.2.0",
    "openai>=1.50.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "pyjwt>=2.9.0",
    "pypdf>=4.3.0",
    "python-docx>=1.1.2",
    "python-multipart>=0.0.9",
    "sqlmodel>=0.0.38",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.6.0",
]
local-embeddings = [
    "fastembed>=0.6.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"app/api/**/*.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
